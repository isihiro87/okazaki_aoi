<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゲスト進捗｜岡崎市葵倫理法人会</title>
<meta name="theme-color" content="#1b2a4a">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/line/liff-guests/css/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <h1>ゲスト進捗</h1>
    <p id="who" class="who">読み込んでいます…</p>
  </div>
</header>

<nav class="tabs" id="tabs" hidden>
  <button class="tab is-on" data-filter="guest">ゲスト</button>
  <button class="tab" data-filter="joined">入会者</button>
  <button class="tab" data-filter="lost">見込み無し</button>
  <button class="tab" data-filter="mine">自分</button>
</nav>

<main class="wrap">
  <button type="button" id="addBtn" class="addbtn" hidden>＋ ゲストを追加する</button>

  <form id="addForm" class="addform" hidden>
    <h2>ゲストを追加</h2>
    <label><span>お名前 <em>必須</em></span><input type="text" data-n="name" placeholder="例）名古 承悟"></label>
    <label><span>ふりがな</span><input type="text" data-n="kana" placeholder="例）なご しょうご"></label>
    <label><span>会社・事業</span><input type="text" data-n="company" placeholder="例）ヤマナ運輸株式会社"></label>
    <label><span>市区町村</span><input type="text" data-n="city" placeholder="例）岡崎市福岡町"></label>
    <label><span>業種</span><input type="text" data-n="industry" placeholder="例）運送業"></label>
    <label><span>ご紹介者</span><input type="text" data-n="referrer" placeholder="例）神道 裕"></label>
    <label><span>初回来訪日</span><input type="date" data-n="firstVisit"></label>
    <label><span>メモ</span><textarea data-n="memo" placeholder="話したこと・様子など"></textarea></label>
    <div class="addform-btns">
      <button type="submit" class="save">追加する</button>
      <button type="button" id="addCancel" class="move back">やめる</button>
    </div>
  </form>

  <p id="msg" class="msg">読み込んでいます…</p>
  <div id="list" class="list"></div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/line/liff-guests/js/app.js"></script>
</body>
</html>

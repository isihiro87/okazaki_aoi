<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>組織図・名簿｜岡崎市葵倫理法人会</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-main">
    <h1>組織図・名簿</h1>
    <p id="who" class="who">確認しています…</p>
  </div>
  <!-- 資料の切り替えタブ。資料の数だけ増える -->
  <nav id="tabs" class="tabs" role="tablist" hidden></nav>
</header>

<main>
  <!-- 起動中 -->
  <div id="loading" class="state">
    <div class="spinner" aria-hidden="true"></div>
    <p>読み込んでいます…</p>
  </div>

  <!-- 見られない方へ -->
  <div id="denied" class="state" hidden>
    <p class="icon" aria-hidden="true">🔒</p>
    <p id="deniedMsg" class="lead"></p>
    <p class="sub">お心当たりがなければ、専任幹事 石本までご連絡ください。</p>
  </div>

  <!-- うまくいかないとき -->
  <div id="error" class="state" hidden>
    <p class="icon" aria-hidden="true">⚠</p>
    <p id="errorMsg" class="lead"></p>
    <button id="retryBtn" class="btn">もう一度ためす</button>
  </div>

  <!-- 資料の中身 -->
  <div id="viewer" hidden>
    <div id="viewerBody" class="paper"></div>
    <p class="note">
      印刷したいときは、右上の「⋯」から<b>ブラウザで開く</b>を選んでください。<br>
      <span id="pdfName" class="mono"></span> と同じ内容です。
    </p>
  </div>
</main>

<footer class="foot">
  <p>この資料には会員の氏名が入っています。<b>画面の共有・撮影・転送はお控えください。</b></p>
</footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="js/app.js"></script>
</body>
</html>
